# Site completo do Genésio no Nginx (jogo + API + HTTPS do certbot). Instalação na VPS:
#   sudo cp /var/www/genesio-game/server/nginx-site.conf /etc/nginx/sites-available/genesio
#   sudo ln -sf /etc/nginx/sites-available/genesio /etc/nginx/sites-enabled/genesio
#   sudo nginx -t && sudo systemctl reload nginx
# (o certificado já existe em /etc/letsencrypt/live/genesio.genesisapps.com.br; se ainda não existir, rode antes:
#  sudo certbot certonly --nginx -d genesio.genesisapps.com.br)

server {
    listen 80;
    listen [::]:80;
    server_name genesio.genesisapps.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name genesio.genesisapps.com.br;

    ssl_certificate /etc/letsencrypt/live/genesio.genesisapps.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genesio.genesisapps.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/genesio-game/dist;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # API (contas, moedas e recordes): serviço genesio-api na porta 3077
    location /api/ {
        proxy_pass http://127.0.0.1:3077;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # HTML, JS e CSS sempre conferem se há versão nova
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    # imagens ficam 1 dia em cache
    location ~* \.(webp|png|jpg|jpeg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # service worker do app nunca pode ficar velho
    location = /sw.js {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "public, max-age=3600";
    }
}
